; Touches du jeu — éditer puis relancer pour rebinder (pas de recompilation nécessaire).
; Noms de touches : voir EKeys d'Unreal (Z, Q, S, D, A, E, SpaceBar, F, LeftShift, ...).
; Défauts AZERTY. Pour QWERTY : Forward=W, StrafeLeft=A, TurnLeft=Q.

[Movement]
Forward=Z
Backward=S
StrafeLeft=Q
StrafeRight=D
TurnLeft=A
TurnRight=E
Jump=SpaceBar

[Camera]
MouseSensitivity=1.0
InvertY=False
ZoomStep=50

[Targeting]
CycleTarget=Tab

[ActionBar]
Slot1=One
Slot2=Two
Slot3=Three
Slot4=Four
Slot5=Five
Slot6=Six
Slot7=Seven
Slot8=Eight
